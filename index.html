<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Switch Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090c15;
      --card-surface: #131a2a;
      --card-border: rgba(255, 255, 255, 0.07);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.35);
      --rose: #f43f5e;
      --amber: #f59e0b;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --btn-subtle: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      color: var(--text);
      padding: 16px 16px 36px;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Top Nav */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    .conn-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 99px;
      padding: 8px 14px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .conn-btn.connected {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .conn-btn.connected .status-dot {
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
    }

    /* Master Control Buttons */
    .master-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-master {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: 16px;
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-master:active {
      transform: scale(0.97);
    }

    .btn-master.on {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-master.off {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
    }

    /* Channel Cards Grid */
    .grid-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:active {
      transform: scale(0.98);
    }

    .card.is-on {
      border-color: rgba(16, 185, 129, 0.45);
      background: linear-gradient(145deg, #131f2f, #15272a);
      box-shadow: 0 8px 24px var(--emerald-glow);
    }

    .card.selected-target {
      outline: 2px dashed var(--amber);
      outline-offset: -2px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      transition: all 0.25s ease;
    }

    .card.is-on .icon-box {
      background: var(--emerald);
      color: #fff;
      box-shadow: 0 0 16px var(--emerald);
    }

    .badge-pill {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
    }

    .card.is-on .badge-pill {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .card-body {
      margin-top: 14px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .timer-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--amber);
      margin-top: 4px;
      min-height: 16px;
    }

    /* Automation / Timer Panel */
    .timer-section {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sec-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .pills-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .pill-btn {
      padding: 10px 0;
      background: var(--btn-subtle);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .pill-btn:hover {
      color: #fff;
    }

    .pill-btn.target-active {
      background: linear-gradient(135deg, var(--amber), #d97706);
      border-color: var(--amber);
      color: #fff;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .duration-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .duration-btn {
      padding: 12px 0;
      background: var(--btn-subtle);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .duration-btn:active {
      background: var(--primary);
      transform: scale(0.95);
    }

    .cancel-btn {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .cancel-btn:active {
      transform: scale(0.98);
      background: rgba(244, 63, 94, 0.25);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand-wrap">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <div>
          <div class="brand-title">Smart Switch</div>
          <div class="brand-sub">4CH Controller</div>
        </div>
      </div>

      <button id="bleBtn" class="conn-btn" onclick="toggleBLE()">
        <span class="status-dot"></span>
        <span id="bleText">Connect</span>
      </button>
    </header>

    <!-- Master Controls -->
    <section class="master-row">
      <button class="btn-master on" onclick="sendCmd('P')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        ALL ON
      </button>
      <button class="btn-master off" onclick="sendCmd('E')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        ALL OFF
      </button>
    </section>

    <!-- 4 Channel Cards Grid -->
    <section class="grid-cards">
      <!-- CH 1 -->
      <div id="card-0" class="card selected-target" onclick="toggleChannel(0)">
        <div class="card-head">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
          </div>
          <span id="badge-0" class="badge-pill">OFF</span>
        </div>
        <div class="card-body">
          <div class="card-title">Channel 1</div>
          <div id="timer-text-0" class="timer-badge"></div>
        </div>
      </div>

      <!-- CH 2 -->
      <div id="card-1" class="card" onclick="toggleChannel(1)">
        <div class="card-head">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
          </div>
          <span id="badge-1" class="badge-pill">OFF</span>
        </div>
        <div class="card-body">
          <div class="card-title">Channel 2</div>
          <div id="timer-text-1" class="timer-badge"></div>
        </div>
      </div>

      <!-- CH 3 -->
      <div id="card-2" class="card" onclick="toggleChannel(2)">
        <div class="card-head">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
          </div>
          <span id="badge-2" class="badge-pill">OFF</span>
        </div>
        <div class="card-body">
          <div class="card-title">Channel 3</div>
          <div id="timer-text-2" class="timer-badge"></div>
        </div>
      </div>

      <!-- CH 4 -->
      <div id="card-3" class="card" onclick="toggleChannel(3)">
        <div class="card-head">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
          </div>
          <span id="badge-3" class="badge-pill">OFF</span>
        </div>
        <div class="card-body">
          <div class="card-title">Channel 4</div>
          <div id="timer-text-3" class="timer-badge"></div>
        </div>
      </div>
    </section>

    <!-- Automation & Timer Section -->
    <section class="timer-section">
      <div class="timer-header">
        <div class="sec-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Timer & Automation
        </div>
      </div>

      <!-- Target Channel Selector -->
      <div>
        <div class="sec-label">1. Select Target Channel</div>
        <div class="pills-row">
          <button id="pill-0" class="pill-btn target-active" onclick="selectChannel(0)">CH 1</button>
          <button id="pill-1" class="pill-btn" onclick="selectChannel(1)">CH 2</button>
          <button id="pill-2" class="pill-btn" onclick="selectChannel(2)">CH 3</button>
          <button id="pill-3" class="pill-btn" onclick="selectChannel(3)">CH 4</button>
        </div>
      </div>

      <!-- Timer Hours -->
      <div>
        <div class="sec-label">2. Set Countdown Duration</div>
        <div class="duration-grid">
          <button class="duration-btn" onclick="setTimer(2)">2H</button>
          <button class="duration-btn" onclick="setTimer(4)">4H</button>
          <button class="duration-btn" onclick="setTimer(6)">6H</button>
          <button class="duration-btn" onclick="setTimer(8)">8H</button>
        </div>
      </div>

      <!-- Cancel Timer Button -->
      <button class="cancel-btn" onclick="cancelTimerTarget()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        Cancel Timer for Selected CH
      </button>
    </section>

  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let bleChar = null;
    let selectedIdx = 0;
    let chStates = [false, false, false, false];
    let channelTimerEnds = [0, 0, 0, 0];

    async function toggleBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        try {
          bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: "ESP32_Smart_Switch" }],
            optionalServices: [SERVICE_UUID]
          });
          bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
          const server = await bleDevice.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);
          bleChar = await service.getCharacteristic(CHAR_UUID);
          await bleChar.startNotifications();
          bleChar.addEventListener('characteristicvaluechanged', handleNotification);

          document.getElementById('bleBtn').classList.add('connected');
          document.getElementById('bleText').innerText = "ESP32";
          sendCmd('Q');
        } catch (err) {
          console.error("BLE Error:", err);
        }
      }
    }

    function onDisconnected() {
      document.getElementById('bleBtn').classList.remove('connected');
      document.getElementById('bleText').innerText = "Connect";
    }

    async function sendCmd(cmd) {
      if (!bleChar) return;
      try {
        await bleChar.writeValue(new TextEncoder().encode(cmd));
      } catch (err) {
        console.error("Send Error:", err);
      }
    }

    function toggleChannel(idx) {
      sendCmd(String(idx + 1));
    }

    function selectChannel(idx) {
      selectedIdx = idx;
      updateSelectionUI();
      sendCmd(['a', 'b', 'c', 'd'][idx]);
    }

    function setTimer(hours) {
      channelTimerEnds[selectedIdx] = Date.now() + (hours * 3600 * 1000);
      chStates[selectedIdx] = true;
      updateCardsUI();
      sendCmd('T' + hours);
    }

    function cancelTimerTarget() {
      channelTimerEnds[selectedIdx] = 0;
      updateCardsUI();
      sendCmd('T' + 2); // Toggles/clears active timer in firmware
    }

    function updateSelectionUI() {
      for (let i = 0; i < 4; i++) {
        const pill = document.getElementById(`pill-${i}`);
        const card = document.getElementById(`card-${i}`);
        if (i === selectedIdx) {
          pill.classList.add('target-active');
          card.classList.add('selected-target');
        } else {
          pill.classList.remove('target-active');
          card.classList.remove('selected-target');
        }
      }
    }

    function handleNotification(e) {
      let str = new TextDecoder().decode(e.target.value);
      if (str.startsWith("S:")) {
        const p = str.substring(2).split(',').map(Number);
        if (p.length === 5) {
          selectedIdx = p[0] - 1;
          chStates = [Boolean(p[1]), Boolean(p[2]), Boolean(p[3]), Boolean(p[4])];
          for(let i=0; i<4; i++) {
            if(!chStates[i]) channelTimerEnds[i] = 0;
          }
          updateSelectionUI();
          updateCardsUI();
        }
      }
    }

    function updateCardsUI() {
      for (let i = 0; i < 4; i++) {
        const card = document.getElementById(`card-${i}`);
        const badge = document.getElementById(`badge-${i}`);

        if (chStates[i]) {
          card.classList.add('is-on');
          badge.innerText = "ON";
        } else {
          card.classList.remove('is-on');
          badge.innerText = "OFF";
        }
      }
    }

    // Live countdown update loop (every 1s)
    setInterval(() => {
      const now = Date.now();
      for (let i = 0; i < 4; i++) {
        const timerBadge = document.getElementById(`timer-text-${i}`);
        if (channelTimerEnds[i] > now && chStates[i]) {
          const diff = Math.floor((channelTimerEnds[i] - now) / 1000);
          const h = String(Math.floor(diff / 3600)).padStart(2, '0');
          const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
          const s = String(diff % 60).padStart(2, '0');
          timerBadge.innerText = `⏳ ${h}:${m}:${s}`;
        } else {
          timerBadge.innerText = "";
          if (channelTimerEnds[i] !== 0 && channelTimerEnds[i] <= now) {
            channelTimerEnds[i] = 0;
            chStates[i] = false;
            updateCardsUI();
          }
        }
      }
    }, 1000);
  </script>
</body>
</html>
