<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLE 4CH Switch</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin: 0 0 16px 0; font-size: 18px; text-align: center; color: #38bdf8; }
    .connect-bar { margin-bottom: 16px; text-align: center; }
    .btn-conn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .btn-conn.connected { background: #10b981; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
    .btn-on { background: #10b981; color: white; }
    .btn-off { background: #334155; color: #94a3b8; }
    .btn-all-on { background: #2563eb; color: white; }
    .btn-all-off { background: #dc2626; color: white; }
    .timer-box { background: #0f172a; border-radius: 12px; padding: 14px; margin-top: 16px; }
    .sec-label { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: bold; margin-bottom: 8px; }
    .sel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .btn-sel { background: #334155; color: #cbd5e1; padding: 8px 0; border: 2px solid transparent; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .btn-sel.active { border-color: #38bdf8; background: #1e293b; color: #38bdf8; }
    .t-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .btn-t { background: #475569; color: white; padding: 10px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚡ BLE 4CH Controller</h2>

    <div class="connect-bar">
      <button id="connBtn" class="btn-conn" onclick="connectBLE()">Pair & Connect Bluetooth</button>
    </div>

    <div class="grid-2">
      <button class="btn btn-all-on" onclick="sendBLE('P')">ALL ON</button>
      <button class="btn btn-all-off" onclick="sendBLE('E')">ALL OFF</button>
    </div>

    <div class="grid-2">
      <button id="l0" class="btn btn-off" onclick="sendBLE('1')">LED 1</button>
      <button id="l1" class="btn btn-off" onclick="sendBLE('2')">LED 2</button>
      <button id="l2" class="btn btn-off" onclick="sendBLE('3')">LED 3</button>
      <button id="l3" class="btn btn-off" onclick="sendBLE('4')">LED 4</button>
    </div>

    <div class="timer-box">
      <div class="sec-label">1. Choose LED to Target</div>
      <div class="sel-grid">
        <button id="sel0" class="btn-sel" onclick="sendBLE('a')">LED 1</button>
        <button id="sel1" class="btn-sel" onclick="sendBLE('b')">LED 2</button>
        <button id="sel2" class="btn-sel" onclick="sendBLE('c')">LED 3</button>
        <button id="sel3" class="btn-sel" onclick="sendBLE('d')">LED 4</button>
      </div>

      <div class="sec-label">2. Assign Duration</div>
      <div class="t-grid">
        <button class="btn-t" onclick="sendBLE('T2')">2M</button>
        <button class="btn-t" onclick="sendBLE('T4')">4M</button>
        <button class="btn-t" onclick="sendBLE('T6')">6M</button>
        <button class="btn-t" onclick="sendBLE('T8')">8M</button>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleChar = null;

    async function connectBLE() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Smart_Switch' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleChar = await service.getCharacteristic(CHAR_UUID);

        document.getElementById('connBtn').className = 'btn-conn connected';
        document.getElementById('connBtn').innerText = 'Connected: ESP32';

        // Enable notifications from ESP32
        await bleChar.startNotifications();
        bleChar.addEventListener('characteristicvaluechanged', handleNotification);

        // Request initial state
        sendBLE('Q');
      } catch (err) {
        console.error("BLE Connect Error:", err);
      }
    }

    function handleNotification(event) {
      const decoder = new TextDecoder('utf-8');
      const msg = decoder.decode(event.target.value);

      if (msg.startsWith("S:")) {
        const parts = msg.substring(2).split(',');
        const target = parseInt(parts[0]);
        const states = [parts[1] === '1', parts[2] === '1', parts[3] === '1', parts[4] === '1'];

        states.forEach((s, idx) => {
          let b = document.getElementById('l' + idx);
          b.className = 'btn ' + (s ? 'btn-on' : 'btn-off');
          b.innerText = 'LED ' + (idx + 1) + (s ? ' (ON)' : ' (OFF)');

          let sel = document.getElementById('sel' + idx);
          sel.className = 'btn-sel ' + (target === idx ? 'active' : '');
        });
      }
    }

    function sendBLE(cmd) {
      if (bleChar) {
        const encoder = new TextEncoder();
        bleChar.writeValue(encoder.encode(cmd));
      }
    }
  </script>
</body>
</html>
